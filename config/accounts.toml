# Declarative account manifest for the live and installed image.
#
# build/gen-accounts.py renders /etc/passwd, /etc/shadow, /etc/group and
# /etc/gshadow from this file. IDs are intentionally small and portable; do
# not copy Arch's host-specific 900-range service UIDs into this file.
#
# password = "*" (no password, login disabled) or "!" (locked).
# lastchg is fixed so the generated files are reproducible.

[[user]]
name = "root"
uid = 0
gid = 0
gecos = "root"
home = "/root"
shell = "/bin/bash"
password = "*"
lastchg = 19000

[[user]]
name = "dhcpcd"
uid = 101
gid = 101
gecos = "dhcpcd privilege separation"
home = "/var/lib/dhcpcd"
shell = "/bin/false"
password = "!"

[[user]]
name = "lightdm"
uid = 102
gid = 102
gecos = "LightDM daemon"
home = "/var/lib/lightdm"
shell = "/bin/false"
password = "!"

[[user]]
name = "tss"
uid = 103
gid = 103
gecos = "tss user for tpm2"
home = "/"
shell = "/bin/false"
password = "!"

[[user]]
name = "nobody"
uid = 65534
gid = 65534
gecos = "nobody"
home = "/"
shell = "/bin/false"
password = "*"

[[group]]
name = "root"
gid = 0

[[group]]
name = "wheel"
gid = 998
members = ["root"]

[[group]]
name = "users"
gid = 100

[[group]]
name = "tty"
gid = 5

[[group]]
name = "disk"
gid = 6

[[group]]
name = "lp"
gid = 7

[[group]]
name = "kmem"
gid = 9

[[group]]
name = "video"
gid = 44

[[group]]
name = "audio"

name: Signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # The release is built and tested on KVM-capable hardware, not on a
    # GitHub-hosted runner.
    runs-on: [self-hosted, linux, kvm]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Check the release signing key
        id: signing
        env:
          RELEASE_KEY: ${{ secrets.GRINTION_RELEASE_KEY }}
        run: |
          # The project has no offline release key at the moment. A tag must
          # still be able to publish an unsigned ISO and its SHA-256, exactly
          # like the manual releases, instead of leaving the job queued and
          # then failing at the first step.
          if [ -n "$RELEASE_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/grintion-release.pem"
            printf '%s' "$RELEASE_KEY" > "$RUNNER_TEMP/grintion-release.pem"
            echo "GRINTION_RELEASE_KEY=$RUNNER_TEMP/grintion-release.pem" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GRINTION_RELEASE_KEY is not set; publishing an unsigned release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a container engine for the pinned rootfs
        run: command -v podman || command -v docker

      - name: Build and test
        run: |
          make check
          make iso-pinned
          ./build/test-boot.sh
          ./build/test-install.sh
          ./build/test-install.sh --uefi

      - name: Sign the tested artifacts
        if: steps.signing.outputs.signed == 'true'
        run: |
          make sign-release
          openssl pkey -in "$GRINTION_RELEASE_KEY" -pubout -out output/grintion-release-public.pem

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            output/grintion-os-x86_64.iso
            output/grintion-os-x86_64.iso.sha256
            output/BUILD-INFO
            output/junit.xml
          )
          if [ -f output/SHA256SUMS.sig ]; then
            assets+=(output/SHA256SUMS output/SHA256SUMS.sig output/grintion-release-public.pem)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes

# Grintion-OS audio fallback.
#
# This image intentionally has no udev, so WirePlumber's ALSA monitor cannot
# enumerate sound cards: it constructs the "api.alsa.enum.udev" SPA device at
# startup. Create the first HDA playback PCM explicitly instead. This is the
# card exposed by QEMU's intel-hda device and by most single-card systems.
context.objects = [
    { factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "alsa_output.hw0"
            node.description     = "HDA Intel Analog"
            media.class          = "Audio/Sink"
            api.alsa.path        = "plughw:0,0"
            api.alsa.period-size = 1024
            api.alsa.headroom    = 0
            audio.format         = "S16LE"
            audio.rate           = 48000
            audio.channels       = 2
            audio.position       = "FL,FR"
            priority.session     = 1000
            node.suspend-on-idle = true
        }
    }
]

# /etc/pacman.conf - Grintion-OS pacman backend
#
# pacman is an optional external backend for garb. It installs packages from
# the official Arch Linux repositories into this image. The native garb
# backend (signed .garb indexes) is unaffected and remains available with
# `garb --backend native`.
#
# Package scripts and hooks written for systemd may not apply here. Prefer
# packages that install plain files; review the package before installing it.

[options]
Architecture = auto
# Package signatures are required. Database signatures cannot be required:
# Arch's official mirrors do not publish core.db.sig/extra.db.sig (both return
# 404, verified 2026-11-03), and Arch's own pacman.conf uses
# "Required DatabaseOptional". Forcing DatabaseRequired breaks `pacman -Sy`
# and therefore every delegated install.
SigLevel = Required DatabaseOptional
# Local packages must carry a valid signature too.
LocalFileSigLevel = Required
Color
CheckSpace
ParallelDownloads = 5
HoldPkg = pacman glibc

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

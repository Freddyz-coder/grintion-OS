# /etc/pacman.conf - Grintion-OS pacman backend
#
# pacman is an optional external backend for garb. It installs packages from
# the official Arch Linux repositories into this image. The native garb
# backend (signed .garb indexes) is unaffected and remains available with
# `garb --backend native`.
#
# Package scripts and hooks written for systemd may not apply here. Prefer
# packages that install plain files; review the package before installing it.
#
# Repositories are the dated Arch Linux Archive snapshot the image was built
# from, not the rolling mirrors. The image's cryptsetup, curl, pacman and sudo
# are linked against OpenSSL 3; the rolling mirrors moved to OpenSSL 4 and
# pacman refused the desktop transaction with "breaks dependency
# libcrypto.so=3-64". Keep this date in sync with config/arch-snapshot.

[options]
Architecture = auto
# Package signatures are required. Database signatures cannot be required:
# Arch's official mirrors do not publish core.db.sig/extra.db.sig (both return
# 404, verified 2026-11-03), and Arch's own pacman.conf uses
# "Required DatabaseOptional". Forcing DatabaseRequired breaks `pacman -Sy`
# and therefore every delegated install.
SigLevel = Required DatabaseOptional
# Local packages must carry a valid signature too.
LocalFileSigLevel = Required
Color
CheckSpace
ParallelDownloads = 5
# The dated archive is slower than the rolling mirrors. pacman's default
# low-speed cutoff aborts a large desktop transaction mid-download even when
# the transfer would eventually finish. The installer still retries a failed
# transaction from its package cache.
DisableDownloadTimeout
HoldPkg = pacman glibc

[core]
Server = https://archive.archlinux.org/repos/2026/11/01/$repo/os/$arch

[extra]
Server = https://archive.archlinux.org/repos/2026/11/01/$repo/os/$arch

# Grintion-OS mdev rules
# Format: <device regex> <uid>:<gid> <mode> [@|$|* <command>]

# Load the driver for every hotplugged device with a MODALIAS.
$MODALIAS=.*            0:0       0660    @modprobe -b $MODALIAS

null                    0:0       0666
zero                    0:0       0666
full                    0:0       0666
random                  0:0       0666
urandom                 0:0       0666
tty                     0:5       0666
console                 0:5       0600
ptmx                    0:5       0666
pts/.*                  0:5       0620
dri/.*                  0:video   0660
snd/.*                  0:audio   0660
input/.*                0:input   0660
kvm                     0:kvm     0660

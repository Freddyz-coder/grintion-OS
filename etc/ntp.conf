# /etc/ntp.conf - time sources for the timesync runit service
#
# busybox ntpd reads "server HOST" lines from this file. Keep more than one
# source: a single unreachable server must not leave the clock unsynchronized.
# Replace these with a local server if the network blocks UDP 123.
server 0.pool.ntp.org
server 1.pool.ntp.org
server 2.pool.ntp.org
server 3.pool.ntp.org

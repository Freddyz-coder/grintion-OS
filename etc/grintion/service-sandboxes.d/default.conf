# Service sandboxing default policies
# Managed by grintion-cgroup and runit chpst

[global]
enforce_private_tmp=true
enforce_protect_system=true
drop_ambient_capabilities=true

[services]
# Service specific overrides
cupsd:user=daemon:group=lp:cgroup_pids=50:cgroup_mem=128M
bluetoothd:user=root:group=root:cgroup_pids=30:cgroup_mem=64M
greetd:user=greetd:group=greetd:cgroup_pids=100:cgroup_mem=256M


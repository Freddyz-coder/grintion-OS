# Grintion-OS Boot-Time and Runtime Optimization Parameters

[initramfs]
# Fast compression level for zstd initramfs
compression=zstd
zstd_level=19
lazy_modules=true
strip_debug=true

[services]
# Parallel service initialization under runit
parallel_startup=true
service_timeout_sec=15

[memory]
# Dynamic tmpfs sizing (percentage of physical RAM)
tmpfs_tmp_size=50%
tmpfs_shm_size=50%
low_ram_threshold_mb=1024

[zram]
enabled=true
algorithm=zstd
size_percentage=50
priority=100


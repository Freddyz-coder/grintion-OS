# Grintion-OS network configuration.
#
# With no [interface ...] sections, the network service runs DHCP on every
# detected wired interface. Add sections to configure interfaces explicitly.
# Wireless association is handled by the wpa_supplicant service and controlled
# with `grintion-network connect`.
#
# MAC randomization is on by default and stable: each interface and Wi-Fi
# network gets a random locally administered address that survives reboots, so
# DHCP reservations and captive portals keep working. Set mac_randomize = true
# for a new address every boot, or false for the hardware address. From the
# CLI: `grintion-network set-mac-randomization IFACE <stable|random|off>`.
#
# [interface enp0s3]
# mode = dhcp
#
# [interface enp0s8]
# mode = static
# static_ip = 192.168.1.50/24
# gateway = 192.168.1.1
# dns = 1.1.1.1, 8.8.8.8
#
# [wifi]
# interface = wlan0
# ssid = MyNetwork
# psk = passphrase-or-64-hex-psk

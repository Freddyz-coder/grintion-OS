# Grintion-OS network configuration.
#
# With no [interface ...] sections, the network service runs DHCP on every
# detected wired interface. Add sections to configure interfaces explicitly.
# Wireless association is handled by the wpa_supplicant service and controlled
# with `grintion-network connect`.
#
# [interface enp0s3]
# mode = dhcp
#
# [interface enp0s8]
# mode = static
# static_ip = 192.168.1.50/24
# gateway = 192.168.1.1
# dns = 1.1.1.1, 8.8.8.8
#
# [wifi]
# interface = wlan0
# ssid = MyNetwork
# psk = passphrase-or-64-hex-psk

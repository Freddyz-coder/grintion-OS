# GPU driver matrix for grintion-desktop.
# Format: <extended-regexp><TAB><space-separated packages>. First match wins.
# The "default" line is used when no pattern matches.
Intel	xf86-video-intel vulkan-intel
AMD|ATI|Radeon	xf86-video-amdgpu vulkan-radeon
NVIDIA	xf86-video-nouveau
QEMU|Red Hat|Virtio|Bochs	xf86-video-qxl xf86-video-fbdev
VMware	xf86-video-vmware
VirtualBox	virtualbox-guest-utils
default	xf86-video-vesa xf86-video-fbdev

NAME=gnome
DESCRIPTION="GNOME Desktop (requires the systemd user session manager)"
# gnome-session 51 starts org.gnome.Shell@wayland.service through
# org.freedesktop.systemd1 and exits with "Failed to start unit" when no
# systemd user manager exists. grintion-desktop refuses this profile rather
# than installing a desktop that cannot draw.
REQUIRES_SYSTEMD=1
PACKAGES="xorg-server xorg-xinit xorg-xrandr xf86-input-evdev xf86-input-libinput xterm ttf-dejavu util-linux linux-firmware wireless-regdb gnome gnome-terminal nautilus pipewire pipewire-pulse pipewire-alsa wireplumber alsa-ucm-conf sof-firmware alsa-utils xdg-desktop-portal xdg-desktop-portal-gtk"
DM="gdm"
DM_BIN="/usr/bin/gdm"
XINITRC="exec gnome-session"
DISPLAY_SERVER="wayland/x11"

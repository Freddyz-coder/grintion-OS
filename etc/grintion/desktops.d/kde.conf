NAME=kde
DESCRIPTION="KDE Plasma (Wayland)"
PACKAGES="xorg-server xorg-xinit xorg-xrandr xf86-input-evdev xf86-input-libinput xterm ttf-dejavu util-linux seatd linux-firmware wireless-regdb networkmanager plasma-nm polkit plasma-meta konsole dolphin pipewire pipewire-pulse pipewire-alsa wireplumber alsa-ucm-conf sof-firmware alsa-utils xdg-desktop-portal xdg-desktop-portal-kde"
DM="sddm"
DM_BIN="/usr/bin/sddm"
# Plasma 6.8 in the Arch package set no longer ships startplasma-x11 or an
# X11 session file. SDDM starts the Wayland session through the tracked
# runtime wrapper; kwin_wayland, plasmashell and ksmserver render in QEMU/KVM.
XINITRC=""
DISPLAY_SERVER="wayland"

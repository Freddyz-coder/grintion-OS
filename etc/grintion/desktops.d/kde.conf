NAME=kde
DESCRIPTION="KDE Plasma (Wayland)"
PACKAGES="xorg-server xorg-xinit xorg-xrandr xf86-input-evdev xterm ttf-dejavu util-linux plasma-meta konsole dolphin pipewire pipewire-pulse pipewire-alsa wireplumber alsa-ucm-conf sof-firmware alsa-utils xdg-desktop-portal xdg-desktop-portal-kde"
DM="sddm"
DM_BIN="/usr/bin/sddm"
# Plasma 6.8 in the Arch package set no longer ships startplasma-x11 or an
# X11 session file. SDDM starts the Wayland session; a rendered Plasma session
# is not verified in 0.10.0 (no Wayland session has been rendered).
XINITRC=""
DISPLAY_SERVER="wayland"

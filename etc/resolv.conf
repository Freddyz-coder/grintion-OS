# Fallback resolvers for the live image. dhcpcd replaces this file with the
# DHCP-provided servers once a lease exists; until then glibc has no nameserver
# and the installer's chroot cannot resolve package mirrors. Keep in sync with
# /etc/resolv.conf.head, which dhcpcd prepends to the DHCP-provided servers.
nameserver 1.1.1.1
nameserver 8.8.8.8

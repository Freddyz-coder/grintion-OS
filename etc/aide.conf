# AIDE configuration file for Grintion-OS
database=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
gzip_dbout=yes

# Rule definitions
# p: permissions, i: inode, n: number of links, u: user, g: group
# s: size, b: block count, m: mtime, a: atime, c: ctime
# sha256: sha256 checksum
FIPSR = p+i+n+u+g+s+m+c+sha256
NORMAL = p+i+n+u+g+s+m+c+sha256
CONF = p+i+n+u+g+s+m+c+sha256

/bin NORMAL
/sbin NORMAL
/usr/bin NORMAL
/usr/sbin NORMAL
/etc CONF
/boot NORMAL
/lib NORMAL
/usr/lib NORMAL

# Exclude volatile logs and caches
!/var/log/.*
!/var/cache/.*
!/tmp/.*
!/var/tmp/.*


#!/usr/sbin/nft -f
# Grintion-OS default firewall: deny unsolicited inbound traffic.
# Outbound traffic is allowed. Add explicit input rules before relying on
# inbound services such as SSH.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # DHCPv4 client and DHCPv6 client replies
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Neighbour discovery and diagnostics
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

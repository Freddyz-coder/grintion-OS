# Grintion-OS Sway session defaults.
# Included by /etc/sway/config (and by a user config copied from it).
# Sway has no XDG autostart, so start the shared audio stack explicitly.
exec grintion-audio --session

# A flat background keeps the session readable before a wallpaper is chosen
# and means a screenshot is never an ambiguous black frame.
output * bg #1e2430 solid_color

# /etc/dhcpcd.conf - Grintion-OS DHCP client
# dhcpcd is started by /etc/sv/network and handles every non-loopback link.

# Do not advertise the machine hostname to every network. Reservations use the
# stable random MAC; DNS registration of the local name is not needed for a
# privacy-focused client. nohook hostname also stops a server-supplied
# host_name from silently renaming the machine.
nohook hostname
duid
persistent
option rapid_commit
option domain_name_servers, domain_name, domain_search, host_name
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
nohook lookup-hostname
